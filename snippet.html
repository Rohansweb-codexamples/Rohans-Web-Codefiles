tem(\"theme\",document.documentElement.classList.contains(\"dark\")?\"dark\":\"light\")});\nif(localStorage.getItem(\"theme\")===\"dark\")document.documentElement.classList.add(\"dark\");","slug":"theme-toggle"},{"title":"Word Counter","desc":"Count words and characters","category":"JavaScript","code":"const text=document.querySelector(\"#text\");\ntext.addEventListener(\"input\",()=>{const words=text.value.trim().split(/\\s+/).filter(Boolean).length;document.querySelector(\"#wordCount\").textContent=words+\" words · \"+text.value.length+\" characters\"});","slug":"word-counter"},{"title":"Random Colour","desc":"Generate and apply a random hex colour","category":"JavaScript","code":"function randomHex(){return \"#\"+Math.floor(Math.random()*0xffffff).toString(16).padStart(6,\"0\")}\ndocument.querySelector(\"#randomColour\").addEventListener(\"click\",()=>{const c=randomHex();document.body.style.background=c;document.querySelector(\"#colourCode\").textContent=c});","slug":"random-colour"},{"title":"Scroll To Top","desc":"Scroll smoothly to the top","category":"JavaScript","code":"document.querySelector(\"#toTop\").addEventListener(\"click\",()=>window.scrollTo({top:0,behavior:\"smooth\"}));","slug":"scroll-to-top"},{"title":"Local Storage Notes","desc":"Save a text area locally","category":"JavaScript","code":"const editor=document.querySelector(\"#notes\");\neditor.value=localStorage.getItem(\"savedNotes\")||\"\";\neditor.addEventListener(\"input\",()=>localStorage.setItem(\"savedNotes\",editor.value));","slug":"local-storage-notes"},{"title":"Copy Current URL","desc":"Copy the current page address","category":"JavaScript","code":"document.querySelector(\"#copyUrl\").addEventListener(\"click\",async()=>{try{await navigator.clipboard.writeText(location.href)}catch{alert(\"Please copy the URL from the address bar\")}});","slug":"copy-current-url"},{"title":"Countdown Timer","desc":"Count days until a target date","category":"JavaScript","code":"const deadline=new Date "desc":"Sweep a highlight over a card","category":"Effects","code":".shine{position:relative;overflow:hidden}.shine:before{content:\"\";position:absolute;inset:-50%;transform:translateX(-120%) rotate(20deg);background:linear-gradient(90deg,transparent,#ffffff22,transparent);transition:transform .6s}.shine:hover:before{transform:translateX(120%) rotate(20deg)}","slug":"card-shine"},{"title":"Animated Gradient","desc":"Loop a warm gradient background","category":"Effects","code":".moving-gradient{background:linear-gradient(120deg,#ff6b25,#ffd34d,#ef476f,#ff6b25);background-size:300% 300%;animation:colour-flow 8s ease infinite}@keyframes colour-flow{50%{background-position:100% 50%}}","slug":"animated-gradient"},{"title":"Debounce Function","desc":"Wait until typing pauses","category":"Utilities","code":"function debounce(fn,delay=250){let timer;return(...args)=>{clearTimeout(timer);timer=setTimeout(()=>fn(...args),delay)}}\nconst delayedSearch=debounce(value=>console.log(value),300);","slug":"debounce-function"},{"title":"Throttle Function","desc":"Limit how often a callback runs","category":"Utilities","code":"function throttle(fn,wait){let ready=true;return(...args)=>{if(!ready)return;ready=false;fn(...args);setTimeout(()=>ready=true,wait)}}\naddEventListener(\"scroll\",throttle(()=>console.log(scrollY),100));","slug":"throttle-function"},{"title":"Fetch JSON Safely","desc":"Load JSON and handle HTTP errors","category":"Utilities","code":"async function loadData(url){const response=await fetch(url);if(!response.ok)throw new Error(\"Request failed: \"+response.status);return response.json()}\nloadData(\"/api/data\").then(console.log).catch(console.error);","slug":"fetch-json-safely"},{"title":"URL Query Reader","desc":"Read a query parameter from the URL","category":"Utilities","code":"const params=new URLSearchParams(location.search);\nconst term=params.get(\"q\")||\"\";\ndocument.querySelector(\"#query\").textContent=term;","slug":"url-query-reader"},{"title":"Form
